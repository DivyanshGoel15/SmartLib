<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLib - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #f5f7fb;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background-color: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 12px;

            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #1d4ed8;
        }

        .error-message {
            background-color: #fee2e2;
            color: #b91c1c;

            padding: 10px 12px;
            border-radius: 6px;

            font-size: 14px;

            margin-bottom: 20px;

            display: none;
        }

        .success-message {
            background-color: #dcfce7;
            color: #15803d;

            padding: 10px 12px;
            border-radius: 6px;

            font-size: 14px;

            margin-bottom: 20px;

            display: none;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;

            font-size: 14px;
            color: #6b7280;
        }

        .signup-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .demo-box {
            margin-top: 25px;
            padding: 15px;

            background-color: #f9fafb;
            border: 1px solid #e5e7eb;

            border-radius: 7px;

            font-size: 12px;
            color: #6b7280;
        }

        .demo-box strong {
            color: #374151;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                SmartLib
            </div>

            <div class="subtitle">
                Library Resource Reservation System
            </div>


            <!-- Error Message -->

            <div
                class="error-message"
                id="errorMessage"
            >
            </div>


            <!-- Success Message -->

            <div
                class="success-message"
                id="successMessage"
            >
            </div>


            <!-- Login Form -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </div>


            <!-- Temporary demo credentials -->

            <div class="demo-box">

                <strong>Demo Account</strong>

                <br><br>

                Email:
                student@smartlib.com

                <br>

                Password:
                123456

            </div>

        </div>

    </div>


    <script>

        /*
        ============================================================
        SMARTLIB LOGIN
        ============================================================
        */


        /*
        ------------------------------------------------------------
        1. DEMO USERS
        ------------------------------------------------------------
        */

        const demoUsers = [

            {
                id: "U001",
                name: "Demo Student",
                email: "student@smartlib.com",
                password: "123456",
                department: "CSE",
                year: 1
            },

            {
                id: "U002",
                name: "Demo AI Student",
                email: "ai@smartlib.com",
                password: "123456",
                department: "AI & ML",
                year: 3
            },

            {
                id: "U003",
                name: "Demo ECE Student",
                email: "ece@smartlib.com",
                password: "123456",
                department: "ECE",
                year: 2
            }

        ];


        /*
        ------------------------------------------------------------
        2. INITIALIZE USERS
        ------------------------------------------------------------
        */

        function initializeUsers() {

            const existingUsers =
                localStorage.getItem("libraryUsers");


            if (!existingUsers) {

                localStorage.setItem(
                    "libraryUsers",
                    JSON.stringify(demoUsers)
                );

            }

        }


        /*
        ------------------------------------------------------------
        3. GET USERS
        ------------------------------------------------------------
        */

        function getUsers() {

            const users =
                localStorage.getItem("libraryUsers");


            if (!users) {

                return [];

            }


            return JSON.parse(users);

        }


        /*
        ------------------------------------------------------------
        4. DOM ELEMENTS
        ------------------------------------------------------------
        */

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");


        /*
        ------------------------------------------------------------
        5. SHOW ERROR
        ------------------------------------------------------------
        */

        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.style.display =
                "block";

            successMessage.style.display =
                "none";

        }


        /*
        ------------------------------------------------------------
        6. SHOW SUCCESS
        ------------------------------------------------------------
        */

        function showSuccess(message) {

            successMessage.textContent =
                message;

            successMessage.style.display =
                "block";

            errorMessage.style.display =
                "none";

        }


        /*
        ------------------------------------------------------------
        7. LOGIN
        ------------------------------------------------------------
        */

        loginForm.addEventListener(
            "submit",
            function(event) {

                /*
                Prevent page refresh
                */

                event.preventDefault();


                /*
                Get input values
                */

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();

                const password =
                    passwordInput.value;


                /*
                Basic validation
                */

                if (
                    email === "" ||
                    password === ""
                ) {

                    showError(
                        "Please enter email and password."
                    );

                    return;

                }


                /*
                Get users
                */

                const users =
                    getUsers();


                /*
                Find matching user
                */

                const user =
                    users.find(function(user) {

                        return (
                            user.email
                                .toLowerCase() ===
                            email &&

                            user.password ===
                            password
                        );

                    });


                /*
                Invalid credentials
                */

                if (!user) {

                    showError(
                        "Invalid email or password."
                    );

                    return;

                }


                /*
                Save logged-in user
                */

                sessionStorage.setItem(
                    "currentUser",
                    JSON.stringify(user)
                );


                /*
                Show success
                */

                showSuccess(
                    "Login successful. Redirecting..."
                );


                /*
                Redirect to resources page
                */

                setTimeout(
                    function() {

                        window.location.href =
                            "resources.html";

                    },
                    700
                );

            }
        );


        /*
        ------------------------------------------------------------
        8. INITIALIZE
        ------------------------------------------------------------
        */

        initializeUsers();

    </script>

</body>
</html>
