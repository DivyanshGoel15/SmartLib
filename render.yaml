services:
  - type: web
    name: smartlib-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://smartlib-frontend-nhu7.onrender.com
      - key: MONGO_URI
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
