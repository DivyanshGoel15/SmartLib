<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLib - Resources</title>

    <link rel="stylesheet" href="resources.css">
</head>

<body>

    <header class="topbar">
        <a class="brand" id="brandLink" href="../home/studentportal/home.html">SMARTLIB</a>
        <nav>
            <a id="navHome" href="../home/studentportal/home.html">Home</a>
            <a href="../seats.html">Study Seats</a>
            <a href="../reservations/reservations.html">Reservations</a>
            <a href="resources.html" class="active">Resources</a>
        </nav>
        <div class="user-area">
            <span id="userInfo">User</span>
            <button id="logoutBtn" class="logout">Logout</button>
        </div>
    </header>

    <main class="container">

        <div class="page-header">
            <h1>Library Resources</h1>
            <p id="departmentText">
                Loading department...
            </p>
        </div>

        <section class="controls">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search resources..."
                >
            </div>

            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-type="All"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-type="Book"
                >
                    Books
                </button>

                <button
                    class="filter-btn"
                    data-type="Equipment"
                >
                    Equipment
                </button>

            </div>

        </section>

        <div class="resource-count" id="resourceCount">
            Loading resources...
        </div>

        <section
            class="resources-grid"
            id="resourcesGrid"
        >
        </section>

    </main>

    <div
        class="message"
        id="message"
    >
    </div>


   <script src="../js/config.js"></script>
   <script src="../js/priorityQueue.js"></script>
   <script src="resources.js"></script>

</body>
</html>
