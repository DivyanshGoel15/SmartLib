<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLib - Resources</title>

    <link rel="stylesheet" href="resources.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">SmartLib</div>

        <div class="nav-right">
            <span class="user-info" id="userInfo">Loading...</span>
            <a href="../reservations/reservations.html">My Reservations</a>

            <button class="logout-btn" id="logoutBtn">
                Logout
            </button>
        </div>
    </nav>

    <main class="container">

        <div class="page-header">
            <h1>Library Resources</h1>
            <p id="departmentText">
                Loading department...
            </p>
        </div>

        <section class="controls">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search resources..."
                >
            </div>

            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-type="All"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-type="Book"
                >
                    Books
                </button>

                <button
                    class="filter-btn"
                    data-type="Equipment"
                >
                    Equipment
                </button>

            </div>

        </section>

        <div class="resource-count" id="resourceCount">
            Loading resources...
        </div>

        <section
            class="resources-grid"
            id="resourcesGrid"
        >
        </section>

    </main>

    <div
        class="message"
        id="message"
    >
    </div>


   <script>

/*
============================================================
SMARTLIB - RESOURCE MANAGEMENT
============================================================
*/


/*
------------------------------------------------------------
1. GET CURRENT USER
------------------------------------------------------------
*/

const currentUser =
    JSON.parse(
        sessionStorage.getItem("smartlibCurrentUser") ||
        sessionStorage.getItem("currentUser") ||
        "null"
    );


/*
------------------------------------------------------------
2. CHECK LOGIN STATUS
------------------------------------------------------------
*/

const isLoggedIn =
    sessionStorage.getItem("smartlibLoggedIn") === "true" ||
    sessionStorage.getItem("currentUser") !== null ||
    sessionStorage.getItem("smartlibCurrentUser") !== null;


if (!currentUser || !isLoggedIn) {

    window.location.href =
        "../landingpage/login.html";

}


/*
------------------------------------------------------------
3. DOM ELEMENTS
------------------------------------------------------------
*/

const resourcesGrid =
    document.getElementById("resourcesGrid");

const searchInput =
    document.getElementById("searchInput");

const resourceCount =
    document.getElementById("resourceCount");

const departmentText =
    document.getElementById("departmentText");

const userInfo =
    document.getElementById("userInfo");

const logoutBtn =
    document.getElementById("logoutBtn");

const message =
    document.getElementById("message");

const filterButtons =
    document.querySelectorAll(".filter-btn");


/*
------------------------------------------------------------
4. CURRENT FILTER
------------------------------------------------------------
*/

let currentFilter = "All";


/*
------------------------------------------------------------
5. INITIAL RESOURCE DATA
------------------------------------------------------------
*/

const initialResources = [

    {
        id: "RES001",
        name: "Data Structures & Algorithms",
        type: "Book",
        department: "CSE",
        totalQuantity: 5,
        availableQuantity: 5
    },

    {
        id: "RES002",
        name: "Operating Systems",
        type: "Book",
        department: "CSE",
        totalQuantity: 4,
        availableQuantity: 4
    },

    {
        id: "RES003",
        name: "Computer Networks",
        type: "Book",
        department: "CSE",
        totalQuantity: 4,
        availableQuantity: 4
    },

    {
        id: "RES004",
        name: "Scientific Calculator",
        type: "Equipment",
        department: "CSE",
        totalQuantity: 5,
        availableQuantity: 5
    },

    {
        id: "RES005",
        name: "Laptop",
        type: "Equipment",
        department: "CSE",
        totalQuantity: 2,
        availableQuantity: 2
    },

    {
        id: "RES006",
        name: "Machine Learning",
        type: "Book",
        department: "AI & ML",
        totalQuantity: 5,
        availableQuantity: 5
    },

    {
        id: "RES007",
        name: "Python Programming",
        type: "Book",
        department: "AI & ML",
        totalQuantity: 5,
        availableQuantity: 5
    },

    {
        id: "RES008",
        name: "GPU Workstation",
        type: "Equipment",
        department: "AI & ML",
        totalQuantity: 2,
        availableQuantity: 2
    },

    {
        id: "RES009",
        name: "Digital Electronics",
        type: "Book",
        department: "ECE",
        totalQuantity: 5,
        availableQuantity: 5
    },

    {
        id: "RES010",
        name: "Arduino Kit",
        type: "Equipment",
        department: "ECE",
        totalQuantity: 3,
        availableQuantity: 3
    }

];


/*
------------------------------------------------------------
6. INITIALIZE LOCAL STORAGE
------------------------------------------------------------
*/

function initializeResources() {

    const storedResources =
        localStorage.getItem(
            "libraryResources"
        );


    if (!storedResources) {

        localStorage.setItem(
            "libraryResources",
            JSON.stringify(initialResources)
        );

    }

}


/*
------------------------------------------------------------
7. GET RESOURCES
------------------------------------------------------------
*/

function getResources() {

    const resources =
        localStorage.getItem(
            "libraryResources"
        );


    if (!resources) {

        return [];

    }


    try {

        return JSON.parse(resources);

    } catch (error) {

        console.error(
            "Error reading resources:",
            error
        );

        return [];

    }

}


/*
------------------------------------------------------------
8. SAVE RESOURCES
------------------------------------------------------------
*/

function saveResources(resources) {

    localStorage.setItem(
        "libraryResources",
        JSON.stringify(resources)
    );

}


/*
------------------------------------------------------------
9. GET RESERVATIONS
------------------------------------------------------------
*/

function getReservations() {

    const reservations =
        localStorage.getItem(
            "libraryReservations"
        );


    if (!reservations) {

        return [];

    }


    try {

        return JSON.parse(reservations);

    } catch (error) {

        console.error(
            "Error reading reservations:",
            error
        );

        return [];

    }

}


/*
------------------------------------------------------------
10. SAVE RESERVATIONS
------------------------------------------------------------
*/

function saveReservations(reservations) {

    localStorage.setItem(
        "libraryReservations",
        JSON.stringify(reservations)
    );

}


/*
------------------------------------------------------------
11. GENERATE UNIQUE ID
------------------------------------------------------------
*/

function generateId(prefix) {

    return (
        prefix +
        Date.now() +
        Math.floor(
            Math.random() * 1000
        )
    );

}


/*
------------------------------------------------------------
12. SHOW MESSAGE
------------------------------------------------------------
*/

function showMessage(text, type) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";


    setTimeout(
        function () {

            message.style.display =
                "none";

        },
        3000
    );

}


/*
------------------------------------------------------------
13. DISPLAY USER INFORMATION
------------------------------------------------------------
*/

function displayUserInformation() {

    userInfo.textContent =
        currentUser.name +
        " | " +
        currentUser.department;


    departmentText.textContent =
        "Showing resources available in the " +
        currentUser.department +
        " department.";

}


/*
------------------------------------------------------------
14. GET ACTIVE RESERVATIONS FOR USER
------------------------------------------------------------
*/

function getActiveReservationsForUser() {

    const reservations =
        getReservations();


    return reservations.filter(
        function (reservation) {

            return (
                reservation.userId ===
                currentUser.id &&
                reservation.status ===
                "active"
            );

        }
    );

}


/*
------------------------------------------------------------
15. CHECK EXISTING RESERVATION
------------------------------------------------------------
*/

function hasActiveReservation(resourceId) {

    const reservations =
        getReservations();


    return reservations.some(
        function (reservation) {

            return (
                reservation.userId ===
                currentUser.id &&
                reservation.resourceId ===
                resourceId &&
                reservation.status ===
                "active"
            );

        }
    );

}


/*
------------------------------------------------------------
16. RESERVE RESOURCE
------------------------------------------------------------
*/

function reserveResource(resourceId) {

    const resources =
        getResources();


    const resource =
        resources.find(
            function (item) {

                return (
                    item.id ===
                    resourceId
                );

            }
        );


    if (!resource) {

        showMessage(
            "Resource not found.",
            "error"
        );

        return;

    }


    if (
        resource.availableQuantity <= 0
    ) {

        showMessage(
            "This resource is currently unavailable. Join the queue.",
            "error"
        );

        return;

    }


    if (
        hasActiveReservation(resourceId)
    ) {

        showMessage(
            "You already have this resource reserved.",
            "error"
        );

        return;

    }


    const activeReservations =
        getActiveReservationsForUser();


    if (
        activeReservations.length >= 2
    ) {

        showMessage(
            "Maximum 2 active resource reservations allowed.",
            "error"
        );

        return;

    }


    const reservations =
        getReservations();


    const newReservation = {

        id: generateId("BOOK"),

        resourceId:
            resource.id,

        userId:
            currentUser.id,

        resourceName:
            resource.name,

        status:
            "active",

        reservedAt:
            new Date().toISOString(),

        returnedAt:
            null

    };


    reservations.push(
        newReservation
    );


    resource.availableQuantity =
        resource.availableQuantity - 1;


    saveResources(
        resources
    );


    saveReservations(
        reservations
    );


    renderResources();


    showMessage(
        resource.name +
        " reserved successfully!",
        "success"
    );

}


/*
------------------------------------------------------------
17. FILTER RESOURCES
------------------------------------------------------------
*/

function getFilteredResources() {

    const resources =
        getResources();


    let filteredResources =
        resources.filter(
            function (resource) {

                return (
                    resource.department ===
                    currentUser.department
                );

            }
        );


    if (
        currentFilter !==
        "All"
    ) {

        filteredResources =
            filteredResources.filter(
                function (resource) {

                    return (
                        resource.type ===
                        currentFilter
                    );

                }
            );

    }


    const searchText =
        searchInput.value
            .trim()
            .toLowerCase();


    if (
        searchText !== ""
    ) {

        filteredResources =
            filteredResources.filter(
                function (resource) {

                    return (
                        resource.name
                            .toLowerCase()
                            .includes(
                                searchText
                            ) ||

                        resource.type
                            .toLowerCase()
                            .includes(
                                searchText
                            )
                    );

                }
            );

    }


    return filteredResources;

}


/*
------------------------------------------------------------
18. RENDER RESOURCES
------------------------------------------------------------
*/

function renderResources() {

    const resources =
        getFilteredResources();


    resourceCount.textContent =
        resources.length +
        " resource type(s) available";


    resourcesGrid.innerHTML =
        "";


    if (
        resources.length === 0
    ) {

        resourcesGrid.innerHTML = `

            <div class="empty-state">

                <h3>
                    No resources found
                </h3>

                <p>
                    Try another search or category.
                </p>

            </div>

        `;

        return;

    }


    resources.forEach(
        function (resource) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "resource-card";


            const availabilityPercentage =
                (
                    resource.availableQuantity /
                    resource.totalQuantity
                ) * 100;


            let progressClass = "";


            if (
                resource.availableQuantity ===
                0
            ) {

                progressClass =
                    "empty";

            }

            else if (
                availabilityPercentage <=
                40
            ) {

                progressClass =
                    "low";

            }


            let statusText = "";

            let statusClass = "";


            if (
                resource.availableQuantity >
                0
            ) {

                statusText =
                    "Available";

                statusClass =
                    "available";

            }

            else {

                statusText =
                    "Currently Unavailable";

                statusClass =
                    "unavailable";

            }


            let buttonHTML = "";


            if (
                resource.availableQuantity >
                0
            ) {

                buttonHTML = `

                    <button
                        class="reserve-btn available"
                        onclick="reserveResource('${resource.id}')"
                    >
                        Reserve
                    </button>

                `;

            }

            else {

                buttonHTML = `

                    <button
                        class="reserve-btn disabled"
                        disabled
                    >
                        Join Queue
                    </button>

                `;

            }


            card.innerHTML = `

                <span class="resource-type">
                    ${resource.type}
                </span>

                <h3>
                    ${resource.name}
                </h3>

                <p>
                    Department:
                    ${resource.department}
                </p>

                <div class="availability">

                    <div class="availability-text">

                        <span>
                            Availability
                        </span>

                        <span>
                            ${resource.availableQuantity}
                            /
                            ${resource.totalQuantity}
                        </span>

                    </div>

                    <div class="progress-bar">

                        <div
                            class="progress ${progressClass}"
                            style="width: ${availabilityPercentage}%"
                        >
                        </div>

                    </div>

                </div>

                <div
                    class="status ${statusClass}"
                >
                    ${statusText}
                </div>

                ${buttonHTML}

            `;


            resourcesGrid.appendChild(
                card
            );

        }
    );

}


/*
------------------------------------------------------------
19. SEARCH
------------------------------------------------------------
*/

searchInput.addEventListener(
    "input",
    function () {

        renderResources();

    }
);


/*
------------------------------------------------------------
20. FILTER BUTTONS
------------------------------------------------------------
*/

filterButtons.forEach(
    function (button) {

        button.addEventListener(
            "click",
            function () {

                filterButtons.forEach(
                    function (btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                currentFilter =
                    button.dataset.type;


                renderResources();

            }
        );

    }
);


/*
------------------------------------------------------------
21. LOGOUT
------------------------------------------------------------
*/

logoutBtn.addEventListener(
    "click",
    function () {

        sessionStorage.removeItem(
            "currentUser"
        );

        sessionStorage.removeItem(
            "smartlibCurrentUser"
        );

        sessionStorage.removeItem(
            "smartlibLoggedIn"
        );


        window.location.href =
            "../landingpage/login.html";

    }
);


/*
------------------------------------------------------------
22. INITIALIZE
------------------------------------------------------------
*/

initializeResources();

displayUserInformation();

renderResources();

</script>

</body>
</html>
