<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLib - Library Seats</title>

    <link rel="stylesheet" href="css/seats.css">
</head>

<body>

    <header class="navbar">
        <h2>SmartLib</h2>

        <nav>
            <a href="home.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="reservations.html">Reservations</a>
        </nav>
    </header>


    <main>

        <section class="library-header">

            <h1>CSE Library</h1>

            <p>Reserve your study seat</p>

            <div class="seat-stats">

                <div class="stat-card">
                    <h3 id="availableCount">0</h3>
                    <p>Available</p>
                </div>

                <div class="stat-card">
                    <h3 id="occupiedCount">0</h3>
                    <p>Occupied</p>
                </div>

                <div class="stat-card">
                    <h3 id="queueCount">0</h3>
                    <p>Waiting</p>
                </div>

            </div>

        </section>


        <section class="seat-section">

            <h2>Library Seats</h2>

            <div id="seatContainer" class="seat-container"></div>

        </section>


        <section class="selection-section">

            <h2>Selected Seat</h2>

            <p id="selectedSeat">
                No seat selected
            </p>

            <button id="reserveButton" disabled>
                Reserve Seat
            </button>

            <button id="releaseButton" disabled>
                Release Seat
            </button>
            <button id="queueButton" disabled>
                Join Queue
            </button>
            <button id="leaveQueueButton" disabled>
                Leave Queue
            </button>

        </section>


        <section class="queue-section">

            <h2>Priority Queue</h2>

            <div id="queueContainer">
                <p>No students are waiting.</p>
            </div>

        </section>

    </main>
    <script src="js/storage.js"></script>
    <script src="js/priorityQueue.js"></script>
    <script src="js/seats.js"></script>

</body>

</html>
